<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>九宫八阵 · 天命牌</title>
  <link rel="stylesheet" href="css/style.css?v=16">
</head>
<body>
  <div id="app">
    <!-- 左侧：战斗数据（动态伸缩） -->
    <aside id="battle-data">
      <div id="battle-data-title">⚔ 战斗数据</div>
      <div id="battle-data-content"></div>
    </aside>

    <!-- 主战场（375px 固定，居中） -->
    <main id="battlefield">
      <div id="enemy-info"></div>

      <section id="enemy-zone">
        <div id="enemy-row"></div>
      </section>

      <section id="river">
        <div id="river-turn" class="river-item"></div>
        <div id="river-hex" class="river-item"></div>
        <div id="river-hint" class="river-item hint"></div>
      </section>

      <section id="grid" aria-label="九宫格桌面"></section>

      <section id="tianji-row">
        <span id="tianji-text"></span>
      </section>

      <button id="end-turn-btn" type="button">回合完毕</button>
    </main>

    <!-- 右侧调试区（不变，动态伸缩） -->
    <aside id="debug-panel">
      <div id="debug-tabs"></div>
      <div id="debug-content"></div>
    </aside>
  </div>

  <div id="modal-root"></div>

  <!-- 数据层 -->
  <script src="js/data/elements.js?v=16"></script>
  <script src="js/data/heroes.js?v=16"></script>
  <script src="js/data/trigram.js?v=16"></script>
  <script src="js/data/enemies.js?v=16"></script>
  <script src="js/data/hex64.js?v=16"></script>
  <!-- 核心 -->
  <script src="js/core/eventSystem.js?v=16"></script>
  <script src="js/core/gameState.js?v=16"></script>
  <script src="js/core/turnSystem.js?v=16"></script>
  <!-- 系统 -->
  <script src="js/systems/hexSystem.js?v=16"></script>
  <script src="js/systems/ruleSystem.js?v=16"></script>
  <script src="js/systems/battleSystem.js?v=16"></script>
  <!-- 渲染 -->
  <script src="js/render/cardRenderer.js?v=16"></script>
  <script src="js/render/battleRenderer.js?v=16"></script>
  <script src="js/render/popupRenderer.js?v=16"></script>
  <!-- 交互 -->
  <script src="js/input/dragController.js?v=16"></script>
  <!-- 自检 -->
  <script src="js/test/selftest.js?v=16"></script>
  <!-- 入口 -->
  <script src="js/main.js?v=16"></script>
</body>
</html>
