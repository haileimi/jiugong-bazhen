<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>九宫八阵 · 天命牌</title>
  <link rel="stylesheet" href="css/style.css?v=43">
</head>
<body>
  <div id="app">
    <!-- 左侧：战斗数据（动态伸缩） -->
    <aside id="battle-data">
      <div id="battle-data-title">⚔ 战斗数据</div>
      <div id="battle-data-content"></div>
    </aside>

    <!-- 主战场（375px 固定，居中） -->
    <main id="battlefield">

      <!-- ============ 首页 ============ -->
      <section id="page-home" class="page">
        <div class="home-box">
          <h1 class="home-title">九宫八阵 · 天命牌</h1>
          <p class="home-sub">v3 主将制 · 一路打怪 · 天命 64 卦</p>

          <div class="home-stats">
            <div class="home-stat">
              <span class="home-stat-icon">💰</span>
              <div>
                <div class="home-stat-label">马蹄金</div>
                <div class="home-stat-value" id="home-gold">0</div>
              </div>
            </div>
            <div class="home-stat">
              <span class="home-stat-icon">🍚</span>
              <div>
                <div class="home-stat-label">军粮（刷新回满）</div>
                <div class="home-stat-value" id="home-rations">5/5</div>
              </div>
            </div>
            <div class="home-stat">
              <span class="home-stat-icon">⚖️</span>
              <div>
                <div class="home-stat-label">善恶</div>
                <div class="home-stat-value" id="home-align">0 · 中立佣兵</div>
              </div>
            </div>
          </div>

          <button id="home-start-btn" class="big-btn" type="button">开始战斗</button>

          <div class="home-extra">
            <button id="home-shop-btn" class="mid-btn" type="button">🏪 商店</button>
            <button id="home-recruit-btn" class="mid-btn" type="button">🏮 招募所</button>
          </div>
        </div>
      </section>

      <!-- ============ 地图页 ============ -->
      <section id="page-map" class="page">
        <div class="map-box">
          <div class="map-topbar">
            <button id="map-back-btn" class="topbar-btn" type="button">← 返回</button>
            <span id="map-layer" class="map-layer">第 1 层</span>
            <button id="map-stats-btn" class="topbar-btn" type="button">📊 统计</button>
          </div>
          <div id="map-nodes" class="map-nodes"></div>
        </div>
      </section>

      <!-- ============ 战斗页（战场 5 区：魔王 / 小鬼 / 界河 / 副将 / 主将） ============ -->
      <section id="page-battle" class="page">
        <div class="battle-topbar">
          <button id="battle-back-btn" class="topbar-btn" type="button">← 返回</button>
          <span class="battle-topbar-title">⚔ 战斗</span>
          <button id="battle-pack-btn" class="topbar-btn" type="button">🃏 卡包</button>
        </div>

        <!-- 魔王区：魔王本体独占最上排（仅魔王战） -->
        <section id="boss-zone"></section>

        <!-- 小鬼区：3×3 敌方（按镜像部门分排） -->
        <section id="enemy-zone">
          <div id="enemy-row"></div>
        </section>

        <!-- 界河区：一行信息（回合数 + 已抽到的卦象） -->
        <section id="river">
          <div id="river-turn" class="river-item"></div>
          <div id="river-hex" class="river-item"></div>
        </section>

        <!-- 副将区：9宫格手牌（与小鬼区对立） -->
        <section id="hand-zone"></section>

        <!-- 主将区：头像 / 名字 / 法宝 / 血量 / 防御 / 卡包 / 天机 -->
        <section id="commander-zone"></section>

        <button id="end-turn-btn" type="button">回合完毕</button>
      </section>

    </main>

    <!-- 右侧调试区（动态伸缩） -->
    <aside id="debug-panel">
      <div id="debug-tabs"></div>
      <div id="debug-content"></div>
    </aside>
  </div>

  <div id="modal-root"></div>

  <!-- 数据层 -->
  <script src="js/data/elements.js?v=43"></script>
  <script src="js/data/heroes.js?v=43"></script>
  <script src="js/data/trigram.js?v=43"></script>
  <script src="js/data/enemies.js?v=43"></script>
  <script src="js/data/hex64.js?v=43"></script>
  <!-- 核心 -->
  <script src="js/core/eventSystem.js?v=43"></script>
  <script src="js/core/gameState.js?v=43"></script>
  <script src="js/core/saveSystem.js?v=43"></script>
  <script src="js/core/turnSystem.js?v=43"></script>
  <!-- 系统 -->
  <script src="js/systems/hexSystem.js?v=43"></script>
  <script src="js/systems/ruleSystem.js?v=43"></script>
  <script src="js/systems/battleSystem.js?v=43"></script>
  <script src="js/systems/economySystem.js?v=43"></script>
  <!-- 渲染 -->
  <script src="js/render/cardRenderer.js?v=43"></script>
  <script src="js/render/battleRenderer.js?v=43"></script>
  <script src="js/render/popupRenderer.js?v=43"></script>
  <!-- 交互 -->
  <script src="js/input/clickController.js?v=43"></script>
  <!-- 自检 -->
  <script src="js/test/selftest.js?v=43"></script>
  <!-- 入口 -->
  <script src="js/main.js?v=43"></script>
</body>
</html>
